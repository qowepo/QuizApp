services:
  identity-db:
    image: postgres:16-alpine
    container_name: quiz-identity-db
    environment:
      POSTGRES_DB: quiz_identity
      POSTGRES_USER: quiz_identity
      POSTGRES_PASSWORD: ${QUIZ_IDENTITY_DB_PASSWORD:?Set QUIZ_IDENTITY_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - quiz-identity-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz_identity -d quiz_identity"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quiz-identity-data:
